version: '3.8'

services:
  telegram-bot:
    build: .
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - SHOP_OWNER_IDS=${SHOP_OWNER_IDS:-}
    volumes:
      - ./data:/app/data
      - ./db.sqlite3:/app/db.sqlite3
    networks:
      - bot-network

  # Optional: Add database for production
  # postgres:
  #   image: postgres:15
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: telegram_bot
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - bot-network

networks:
  bot-network:
    driver: bridge

volumes:
  postgres_data:  # Uncomment if using postgres
